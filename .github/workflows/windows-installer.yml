# Builds the Windows installer (NSIS setup .exe) after the full test suite.
# - push / pull request / manual run: the installer is uploaded as a workflow artifact.
# - tag v<version> (e.g. v0.1.0, must match tauri.conf.json): also a draft GitHub Release.
name: Windows installer

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          app=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$app" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match tauri.conf.json version $app"
            exit 1
          fi

      - name: Install npm dependencies
        run: npm ci

      - name: Frontend tests
        run: npm test

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      # Live R2 tests are #[ignore] and never run here: CI holds no R2 credentials.
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: Build installer
        run: npm run tauri build -- --bundles nsis

      - uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          if-no-files-found: error
          path: src-tauri/target/release/bundle/nsis/*-setup.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: windows-installer
          path: installers

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" installers/*-setup.exe \
            --repo "$GITHUB_REPOSITORY" --draft --generate-notes \
            --title "HiResAudio Upload $GITHUB_REF_NAME"
